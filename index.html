<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Портфолио Ж. Салимановой</title>
<meta name="description" content="Тарих пәні мұғалімі Салиманова Жанылсын Кадиржановнаның портфолиосы — ғасырлар арқылы саяхат">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c140f; --parch:#f6efe2; --gold:#d4ad62; --gold2:#f0d595;
  --line:rgba(240,213,149,.28); --glass:rgba(16,11,8,.58);
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#0d0906;color:var(--parch);font-family:var(--sans);font-weight:300;line-height:1.55;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
#gl{position:fixed;inset:0;z-index:0}
#gl canvas,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{z-index:1;pointer-events:none}
main{position:relative;z-index:2}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}

/* loader */
#load{position:fixed;inset:0;z-index:300;background:#0d0906;display:grid;place-items:center;transition:opacity 1s .2s}
#load.done{opacity:0;pointer-events:none}
#load .lt{font-family:var(--serif);font-size:30px;font-style:italic;color:var(--gold2);text-align:center}
#load .bar{width:180px;height:1px;background:rgba(240,213,149,.2);margin:18px auto 0;overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:var(--gold2);transition:width .3s}

/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:16px 26px;transition:background .4s}
nav.solid{background:rgba(13,9,6,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.logo{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--gold2);text-decoration:none}
.lang{display:flex;border:1px solid var(--gold);border-radius:30px;overflow:hidden;background:rgba(13,9,6,.4)}
.lang button{background:none;border:0;color:var(--parch);padding:6px 14px;font:500 12px var(--sans);letter-spacing:.1em;cursor:pointer}
.lang button.on{background:var(--gold);color:var(--ink)}
#eras{position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;gap:14px}
#eras a{width:11px;height:11px;border-radius:50%;border:1px solid var(--gold2);display:block;position:relative;transition:.3s}
#eras a.on{background:var(--gold2);transform:scale(1.35)}
#eras a span{position:absolute;right:22px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:0;transition:.3s;background:rgba(13,9,6,.75);padding:3px 10px;border-radius:12px}
#eras a:hover span,#eras a.on span{opacity:1}

/* ===== INTRO (teacher) ===== */
#intro{height:460vh;position:relative}
.stage{position:sticky;top:0;height:100vh;overflow:hidden}
#teacher{position:absolute;bottom:0;right:9vw;height:92vh;width:auto;max-width:none;transform-origin:50% 100%;
  filter:brightness(.9) contrast(1.04) saturate(.95) drop-shadow(0 0 40px rgba(255,190,110,.22));will-change:transform,opacity,filter;opacity:0}
#teacher.in{animation:appear 2.2s cubic-bezier(.2,.8,.2,1) .4s forwards}
@keyframes appear{0%{opacity:0;filter:brightness(2.2) blur(14px) drop-shadow(0 0 60px rgba(255,200,120,.9))}100%{opacity:1;filter:brightness(.9) contrast(1.04) saturate(.95) blur(0) drop-shadow(0 0 40px rgba(255,190,110,.22))}}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,8,5,.82) 0%,rgba(12,8,5,.55) 32%,rgba(12,8,5,0) 58%),linear-gradient(0deg,rgba(12,8,5,.5),transparent 30%)}
.floor{position:absolute;bottom:-4vh;right:calc(9vw - 3vh);width:34vh;height:8vh;border-radius:50%;background:radial-gradient(rgba(0,0,0,.65),transparent 70%)}
.say{position:absolute;left:7vw;top:50%;width:min(600px,50vw)}
.say > div{position:absolute;top:50%;left:0;transform:translateY(-50%);width:100%;opacity:0;transition:none}
.kicker{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold2)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(46px,7vw,104px);line-height:.92;margin:16px 0 18px;text-shadow:0 6px 40px rgba(0,0,0,.6)}
h1 em,.big em{font-style:italic;color:var(--gold2);font-weight:500}
.big{font-family:var(--serif);font-size:clamp(36px,4.6vw,66px);line-height:1.04;font-weight:600;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.sub{font-size:17px;opacity:.9;margin-top:16px;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.cta{display:inline-flex;align-items:center;gap:12px;margin-top:26px;background:var(--gold);color:var(--ink);padding:14px 26px;border-radius:40px;font-weight:600;font-size:14px;text-decoration:none;box-shadow:0 0 0 0 rgba(212,173,98,.6);animation:pulse 2.2s infinite}
@keyframes pulse{100%{box-shadow:0 0 0 26px rgba(212,173,98,0)}}
.cue{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font-size:11px;letter-spacing:.3em;text-transform:uppercase;text-align:center;opacity:.85}
.cue::after{content:"";display:block;width:1px;height:34px;background:linear-gradient(var(--gold2),transparent);margin:10px auto 0;animation:drop 1.8s infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ===== ERAS ===== */
.portal{height:170vh;position:relative}
.era{position:sticky;top:30vh;text-align:center;padding:0 20px;opacity:0}
.era .yr{font-family:var(--serif);font-size:clamp(80px,15vw,210px);line-height:1;color:#fff6e0;font-style:italic;text-shadow:0 0 70px rgba(255,205,130,.85),0 4px 30px rgba(0,0,0,.4)}
.era .nm{font-size:13px;letter-spacing:.45em;text-transform:uppercase;margin-top:8px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.era .t2{font-family:var(--serif);font-size:clamp(28px,3.8vw,50px);text-shadow:0 2px 18px rgba(0,0,0,.8)}
.scene{padding:70vh 0 40vh}
.scene .panel + .panel{margin-top:70vh}
.panel{background:var(--glass);backdrop-filter:blur(16px) saturate(130%);-webkit-backdrop-filter:blur(16px) saturate(130%);border:1px solid var(--line);border-radius:28px;padding:clamp(26px,4.5vw,58px);box-shadow:0 40px 100px -40px rgba(0,0,0,.8)}
h2{font-family:var(--serif);font-weight:600;font-size:clamp(40px,5vw,70px);line-height:1;margin:12px 0 18px}
h2 em{font-style:italic;color:var(--gold2);font-weight:500}
.lead{font-size:17px;max-width:620px;opacity:.88}

.motto{font-family:var(--serif);font-size:clamp(28px,3.4vw,46px);line-height:1.15;font-style:italic;max-width:900px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:30px;padding:7px 15px;background:rgba(255,240,210,.05)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:34px;border-top:1px solid var(--line)}
.stat{padding:28px 10px 6px;text-align:center}
.stat .n{font-family:var(--serif);font-size:clamp(52px,6vw,86px);line-height:1;color:var(--gold2)}
.stat .l{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.78;margin-top:8px}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.tile{border:1px solid var(--line);border-radius:18px;padding:22px;background:rgba(255,240,210,.04);transition:transform .4s,border-color .4s,background .4s}
.tile:hover{transform:translateY(-6px);border-color:var(--gold);background:rgba(255,240,210,.09)}
.tile .ic{font-size:28px}
.tile h3{font-family:var(--serif);font-size:23px;font-weight:600;margin:8px 0 4px;line-height:1.1}
.tile p{font-size:13px;opacity:.75}
.qrow{display:grid;grid-template-columns:1fr 1.2fr;gap:40px;align-items:end}
.bars{display:flex;gap:22px;align-items:flex-end;height:250px;border-bottom:1px solid var(--gold2);margin-bottom:30px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.bar .fill{width:100%;height:0;background:linear-gradient(180deg,var(--gold2),#8a5a22);border-radius:10px 10px 0 0;transition:height 1.6s cubic-bezier(.2,.8,.2,1)}
.bar .pct{font-family:var(--serif);font-size:36px;font-weight:600;margin-bottom:4px}
.bar .yr{font-size:12px;position:absolute;bottom:-26px;opacity:.8}
.zoom{color:var(--gold2);font-size:13px}

.years{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px}
.yrc{border-top:2px solid var(--gold);padding-top:12px}
.yrc b{font-family:var(--serif);font-size:34px;color:var(--gold2);font-weight:600;display:block;line-height:1}
.yrc span{font-size:13px;opacity:.85}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 18px}
.filters button{background:none;border:1px solid var(--line);color:inherit;border-radius:30px;padding:8px 18px;font:400 13px var(--sans);cursor:pointer;transition:.25s}
.filters button.on,.filters button:hover{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.strip{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px calc(50% - 115px) 22px;scrollbar-width:thin;scrollbar-color:var(--gold) transparent}
.strip::-webkit-scrollbar{height:6px}.strip::-webkit-scrollbar-thumb{background:var(--gold);border-radius:6px}
.card{flex:0 0 230px;scroll-snap-align:center;border-radius:14px;overflow:hidden;background:#fbf6ec;color:var(--ink);cursor:zoom-in;transition:transform .35s}
.card:hover{transform:translateY(-6px) rotate(-.6deg)}
.card .ph{height:300px;background:#eee center/cover no-repeat}
.card .cap{padding:11px 13px 13px;font-size:12.5px;line-height:1.4}
.card .cap b{display:flex;justify-content:space-between;gap:6px;font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#a5502e;margin-bottom:4px}
.card.hide{display:none}
.navbtns{display:flex;gap:8px}
.navbtns button{width:42px;height:42px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold2);font-size:18px;cursor:pointer}
.navbtns button:hover{background:var(--gold);color:var(--ink)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}

.medals{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0 20px}
.medal{border-radius:16px;padding:16px;text-align:center;color:var(--ink);background:#e8dcc6}
.medal .n{font-family:var(--serif);font-size:46px;font-weight:600;line-height:1}
.medal.g{background:linear-gradient(150deg,#f3dc9c,#c8a25a)}.medal.s{background:linear-gradient(150deg,#f0ede7,#bdb6aa)}.medal.b{background:linear-gradient(150deg,#ebbf9a,#b87648)}
.medal .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}

.game{display:grid;grid-template-columns:1fr 1.3fr;gap:38px;align-items:center}
.gframe{position:relative;aspect-ratio:16/11;border-radius:18px;overflow:hidden;border:1px solid var(--gold);background:#120c08}
.gframe iframe{width:100%;height:100%;border:0}
.gframe .cover{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle,rgba(20,14,10,.15),rgba(20,14,10,.8)),url(img/era3.jpg) center/cover;cursor:pointer;transition:opacity .4s}
.gframe .cover span{background:var(--gold);color:var(--ink);padding:14px 26px;border-radius:40px;font-weight:600;font-size:14px}
.gframe.live .cover{opacity:0;pointer-events:none}
.btn{display:inline-flex;align-items:center;gap:10px;margin-top:22px;background:var(--gold);color:var(--ink);text-decoration:none;padding:13px 24px;border-radius:40px;font-weight:600;font-size:13.5px;transition:transform .25s}
.btn:hover{transform:translateY(-3px)}
.btn.ghost{background:none;border:1px solid var(--gold);color:var(--gold2);margin-left:8px}

.lessons{display:grid;grid-template-columns:1fr 1fr;gap:0 30px;margin-top:20px}
.lesson{border-top:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.lesson .cl{font-family:var(--serif);font-size:30px;color:var(--gold2);font-style:italic}
.lesson h4{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.15}
.score{font-size:11px;border:1px solid var(--gold);color:var(--gold2);border-radius:20px;padding:4px 10px;white-space:nowrap}
.video{aspect-ratio:21/9;border-radius:18px;margin-top:26px;background:linear-gradient(rgba(13,9,6,.55),rgba(13,9,6,.8)),url(img/teacher-lib.jpg) center 30%/cover;display:grid;place-items:center;text-align:center;border:1px solid var(--line)}
.play{width:78px;height:78px;border-radius:50%;background:var(--gold);display:grid;place-items:center;margin:0 auto 12px;animation:pulse 2.2s infinite}
.play::after{content:"";border-left:22px solid var(--ink);border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:6px}

footer{padding:30vh 0 70px;text-align:center}
footer .big{font-size:clamp(50px,8.5vw,120px);font-style:italic;color:#fff3d6;text-shadow:0 0 60px rgba(242,193,78,.65)}
footer p{opacity:.75;font-size:13px;margin-top:18px;text-shadow:0 2px 10px #000}

#lb{position:fixed;inset:0;background:rgba(8,5,3,.94);z-index:200;display:none;align-items:center;justify-content:center;padding:30px;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-height:92vh;max-width:92vw;border-radius:8px}
#lb .x{position:absolute;top:18px;right:26px;font-size:34px}

.panel{position:relative}
.panel::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,228,170,.16),transparent 45%);opacity:var(--go,0);transition:opacity .4s}
.card{transition:transform .3s ease-out,opacity .3s}
.card:hover{transform:none}
.rv{opacity:0;transform:perspective(1200px) rotateX(18deg) translateY(110px) scale(.94);transform-origin:50% 100%;filter:blur(6px);transition:opacity 1.2s,transform 1.4s cubic-bezier(.16,.84,.2,1),filter 1.2s}
.rv.in{opacity:1;transform:none;filter:none}

@media (max-width:900px){
  #eras{display:none}
  #teacher{right:50%;transform:translateX(50%);height:66vh}
  .shade{background:linear-gradient(180deg,rgba(12,8,5,.85) 0%,rgba(12,8,5,.55) 38%,rgba(12,8,5,0) 60%)}
  .say{left:16px;right:16px;top:18vh;transform:none;max-width:none}
  .say > div{top:0;transform:none}
  h1{font-size:44px}
  .stats,.medals{grid-template-columns:1fr 1fr}
  .tiles{grid-template-columns:1fr 1fr}
  .qrow,.game,.lessons{grid-template-columns:1fr}
  .years{grid-template-columns:1fr 1fr}
  .wrap{padding:0 14px}
  .btn.ghost{margin-left:0}
  .card{flex-basis:200px}.card .ph{height:260px}
}
@media (max-width:520px){.tiles{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none;filter:none}#teacher{opacity:1}}
</style>
</head>
<body>
<div id="load"><div><div class="lt">Тарих — тірі</div><div class="bar"><i id="lbar"></i></div></div></div>
<div id="gl"></div>
<canvas id="fx"></canvas>

<nav id="nav">
  <a class="logo" href="#intro">Ж.С.</a>
  <div class="lang"><button data-l="kz" class="on">ҚАЗ</button><button data-l="ru">РУС</button></div>
</nav>
<div id="eras"></div>

<main>
<!-- INTRO: library + teacher -->
<section id="intro" data-stage="hold" data-a="0" data-z0="0" data-z1=".28">
  <div class="stage">
    <div class="shade" id="shade"></div>
    <video id="vid" src="video/welcome.mp4" muted playsinline loop autoplay preload="auto" aria-label="Салиманова Жанылсын Кадиржановна" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>
    <div class="say">
      <div id="s0"><div class="kicker" data-t="kick"></div><h1>Салиманова<br><em>Жанылсын</em><br>Кадиржановна</h1><p class="sub" data-t="role"></p></div>
      <div id="s1"><div class="big" data-t="hi"></div><p class="sub" data-t="hi2"></p></div>
      <div id="s2"><div class="big" data-t="inv"></div><a class="cta" href="#p1" data-t="go"></a></div>
    </div>
    <div class="cue" id="cue" data-t="scroll"></div>
  </div>
</section>

<div class="portal" id="p1" data-stage="trans" data-a="0" data-b="1"><div class="era"><div class="yr" data-t="y1"></div><div class="nm" data-t="e1n"></div><div class="t2" data-t="e1t"></div></div></div>

<!-- ERA 1: steppe -->
<section class="scene" data-stage="hold" data-a="1" data-z0="0" data-z1=".35">
  <div class="wrap">
    <div class="panel rv">
      <div class="kicker" data-t="aboutK"></div>
      <p class="motto" data-t="motto"></p>
      <div class="chips"><span class="chip" data-t="c1"></span><span class="chip" data-t="c2"></span><span class="chip" data-t="c3"></span><span class="chip" data-t="c4"></span></div>
      <div class="stats">
        <div class="stat"><div class="n" data-count="89" data-suf="%">0</div><div class="l" data-t="s1"></div></div>
        <div class="stat"><div class="n" data-count="21">0</div><div class="l" data-t="s2"></div></div>
        <div class="stat"><div class="n" data-count="15">0</div><div class="l" data-t="s3"></div></div>
        <div class="stat"><div class="n" data-count="10">0</div><div class="l" data-t="s4"></div></div>
      </div>
    </div>
  </div>
</section>

<div class="portal" data-stage="trans" data-a="1" data-b="2"><div class="era"><div class="yr" data-t="y2"></div><div class="nm" data-t="e2n"></div><div class="t2" data-t="e2t"></div></div></div>

<!-- ERA 2: Silk Road -->
<section class="scene" data-stage="hold" data-a="2" data-z0="0" data-z1=".35">
  <div class="wrap">
    <div class="panel rv">
      <div class="kicker" data-t="mK"></div>
      <h2 data-t="mH"></h2>
      <div class="tiles" id="tiles"></div>
    </div>
    <div class="panel rv qrow">
      <div><div class="kicker" data-t="qK"></div><h2 data-t="qH"></h2><a href="img/quality.jpg" class="zoom" data-t="qDoc"></a></div>
      <div class="bars" id="bars">
        <div class="bar"><div class="pct">79%</div><div class="fill" data-h="79"></div><div class="yr">2023–24</div></div>
        <div class="bar"><div class="pct">83%</div><div class="fill" data-h="83"></div><div class="yr">2024–25</div></div>
        <div class="bar"><div class="pct">89%</div><div class="fill" data-h="89"></div><div class="yr">2025–26</div></div>
      </div>
    </div>
  </div>
</section>

<div class="portal" data-stage="trans" data-a="2" data-b="3"><div class="era"><div class="yr">1465</div><div class="nm" data-t="e3n"></div><div class="t2" data-t="e3t"></div></div></div>

<!-- ERA 3: Khanate -->
<section class="scene" data-stage="hold" data-a="3" data-z0="0" data-z1=".35">
  <div class="wrap">
    <div class="panel rv">
      <div class="head"><div><div class="kicker" data-t="aK"></div><h2 data-t="aH"></h2></div><div class="navbtns"><button data-s="gA" data-d="-1">←</button><button data-s="gA" data-d="1">→</button></div></div>
      <div class="years" id="years"></div>
      <div class="filters" id="fA"></div>
      <div class="strip" id="gA"></div>
    </div>
  </div>
</section>

<div class="portal" data-stage="trans" data-a="3" data-b="4"><div class="era"><div class="yr">1991</div><div class="nm" data-t="e4n"></div><div class="t2" data-t="e4t"></div></div></div>

<!-- ERA 4: Astana -->
<section class="scene" data-stage="hold" data-a="4" data-z0="0" data-z1=".3" style="padding-bottom:0">
  <div class="wrap">
    <div class="panel rv">
      <div class="head"><div><div class="kicker" data-t="stK"></div><h2 data-t="stH"></h2></div><div class="navbtns"><button data-s="gS" data-d="-1">←</button><button data-s="gS" data-d="1">→</button></div></div>
      <div class="medals">
        <div class="medal g"><div class="n">2</div><div class="l" data-t="m1"></div></div>

function measure(){stages=$$("[data-stage]").map(e=>{const r=e.getBoundingClientRect();return{el:e,top:r.top+scrollY,h:r.height,type:e.dataset.stage,a:+e.dataset.a,b:+(e.dataset.b||0),z0:+(e.dataset.z0||0),z1:+(e.dataset.z1||0),era:e.querySelector(".era")}});
  stages.forEach((s,i)=>{if(s.type==="trans"){const prev=stages[i-1];s.za=prev?prev.z1:0}});onScroll()}
addEventListener("resize",measure);addEventListener("load",measure);new ResizeObserver(measure).observe($("main"));
const S={a:0,b:1,p:0,za:0,zb:0,era:0};
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const shEl=$("#shade"),say=[$("#s0"),$("#s1"),$("#s2")],cue=$("#cue"),intro=$("#intro");
const band=(p,a,b,f=.06)=>Math.max(0,Math.min(1,(p-a)/f))*Math.max(0,Math.min(1,(b-p)/f));
function onScroll(){
  $("#nav").classList.toggle("solid",scrollY>40);
  // intro choreography
  const ip=Math.max(0,Math.min(1,scrollY/(intro.offsetHeight-innerHeight)));
  const o=[ip<.06?1:band(ip,-1,.24),band(ip,.28,.54),band(ip,.58,.86)];
  say.forEach((s,i)=>{s.style.opacity=o[i];s.style.transform=(innerWidth>900?"translateY(-50%) ":"")+"translateY("+((1-o[i])*24)+"px)";s.style.pointerEvents=o[i]>.5?"auto":"none"});
  cue.style.opacity=Math.max(0,1-ip*8);
  shEl.style.opacity=(1-Math.max(0,Math.min(1,(ip-.86)/.14))).toFixed(3);
  if(!stages.length)return;
  const c=scrollY+innerHeight*.5;let m=stages[0];for(const s of stages)if(c>=s.top)m=s;
  const t=Math.max(0,Math.min(1,(c-m.top)/m.h));
  if(m.type==="hold"){S.a=m.a;S.b=m.a;S.p=0;S.za=m.z0+(m.z1-m.z0)*t;S.zb=0;S.era=m.a}
  else{S.a=m.a;S.b=m.b;S.p=ease(t);S.za=m.za;S.zb=0;S.era=t<.5?m.a:m.b}
  stages.forEach(s=>{if(s.era){const v=s===m?Math.max(0,(Math.sin(Math.PI*t)-.3)/.7):0;s.era.style.opacity=v.toFixed(2);s.era.style.transform=`scale(${.9+v*.1})`}});
  $$("#eras a").forEach((a,i)=>a.classList.toggle("on",i===S.era));
}
addEventListener("scroll",onScroll,{passive:true});
render();

/* ============ CINEMATIC WEBGL ============ */
const SCENES=[
 {video:"#vid",asp:16/9,f:[.22,.80],r:[.22,.86],rs:.4,fx:"beam",cx:.6,p:[.95,0,0,0],g:[1,.85,.6,0]},
 {src:"img/era1.jpg",asp:16/9,f:[.22,.78],r:[.22,.80],rs:.65,fx:"pollen",p:[.62,.9,.9,0],g:[1,.88,.72,.38]},
 {src:"img/era2.jpg",asp:16/9,f:[.74,.52],r:[.97,.44],rs:.4,fx:"sand",p:[.27,0,.12,0],g:[.95,.74,.5,.28]},
 {src:"img/era3.jpg",asp:16/9,f:[.18,.40],r:[.47,.30],rs:.18,fx:"embers",p:[.74,.55,.1,0],g:[.62,.6,.82,.24]},
 {src:"img/era4.jpg",asp:16/9,f:[.50,.86],r:[.50,.87],rs:.35,fx:"lights",p:[.92,0,0,.65],g:[.5,.62,.95,.1]}
];
(function(){
  const mobile=innerWidth<768||matchMedia("(pointer:coarse)").matches;
  const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
  const lbar=$("#lbar");let loaded=0;
  const done=()=>{if($("#load").classList.contains("done"))return;$("#load").classList.add("done");const v=$("#vid");v.currentTime=0;v.play().catch(()=>{});measure();onScroll()};
  if(!window.THREE){done();return}
  const R=new THREE.WebGLRenderer({antialias:false});R.setPixelRatio(mobile?1:Math.min(devicePixelRatio,1.5));R.setSize(innerWidth,innerHeight);$("#gl").appendChild(R.domElement);
  const cam=new THREE.OrthographicCamera(-1,1,1,-1,0,1),scene=new THREE.Scene();
  const L=new THREE.TextureLoader();
  const ok=()=>{loaded++;lbar.style.width=(loaded/SCENES.length*100)+"%";if(loaded===SCENES.length)setTimeout(done,300)};
  const tex=SCENES.map(s=>{let t;
    if(s.video){const v=$(s.video);t=new THREE.VideoTexture(v);let once=0;const f=()=>{if(!once){once=1;ok()}};
      if(v.readyState>=2)f();else{v.addEventListener("loadeddata",f);v.addEventListener("error",f)}v.play().catch(()=>{});
      addEventListener("pointerdown",()=>v.play().catch(()=>{}),{once:true});}
    else t=L.load(s.src,ok);
    t.minFilter=THREE.LinearFilter;t.generateMipmaps=false;return t});
  setTimeout(()=>{if(loaded<SCENES.length)done()},9000);
  const RS=mobile?8:16;
  const U={tA:{value:tex[0]},tB:{value:tex[1]},aA:{value:16/9},aB:{value:16/9},scr:{value:innerWidth/innerHeight},
    fA:{value:new THREE.Vector2()},fB:{value:new THREE.Vector2()},rA:{value:new THREE.Vector2()},rB:{value:new THREE.Vector2()},
    rsA:{value:0},rsB:{value:0},cA:{value:.5},cB:{value:.5},
    pA:{value:new THREE.Vector4()},pB:{value:new THREE.Vector4()},gA:{value:new THREE.Vector4()},gB:{value:new THREE.Vector4()},zA:{value:0},zB:{value:0},p:{value:0},time:{value:0},mouse:{value:new THREE.Vector2()},res:{value:new THREE.Vector2(innerWidth,innerHeight)}};
  const frag=`
precision highp float;varying vec2 vUv;
uniform sampler2D tA,tB;uniform float aA,aB,scr,zA,zB,p,time,rsA,rsB,cA,cB;uniform vec2 fA,fB,rA,rB,mouse,res;
uniform vec4 pA,pB,gA,gB; // p:(horizon,clouds,wind,ripple)  g:(fog rgb, fog amount)
vec2 sc(float ia){return scr>ia?vec2(1.,ia/scr):vec2(scr/ia,1.);}
float CX;vec2 OFF;
float h1(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(h1(i),h1(i+vec2(1,0)),f.x),mix(h1(i+vec2(0,1)),h1(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){return .55*vn(p)+.3*vn(p*2.1+3.7)+.15*vn(p*4.3+1.3);}
vec2 distort(vec4 q,vec2 uv){
  float sky=smoothstep(q.x,q.x+.12,uv.y),near=1.-smoothstep(0.,.42,uv.y),wet=1.-smoothstep(0.,.24,uv.y);
  vec2 o=vec2(0.);
  o+=q.y*sky*vec2(fbm(uv*vec2(2.5,5.)+vec2(time*.035,0.))-.5,(fbm(uv*vec2(3.,6.)-vec2(time*.02,0.))-.5)*.4)*.028;  // drifting clouds
  float g=fbm(uv*vec2(16.,3.)+vec2(time*.7,0.));                                                                       // wind gusts in grass
  o+=q.z*near*vec2((g-.5)*.016+sin(uv.y*40.+time*2.2+g*6.)*.0025,0.);
  o.y+=q.w*wet*sin(uv.y*170.+time*2.4+fbm(uv*12.+time*.3)*7.)*.0028;                                                   // wet pavement ripples
  return o;}
vec3 fog(vec3 c,vec4 q,vec4 g,vec2 uv){
  float band=1.-smoothstep(0.,.22,abs(uv.y-(q.x-.12)));
  float n=fbm(uv*vec2(2.2,6.)+vec2(time*.025,time*.01));
  return mix(c,g.rgb*(.7+.5*n),clamp(g.a*band*smoothstep(.3,.8,n)*1.6,0.,.75));}
vec3 shot(sampler2D t,float ia,vec2 f,float z,vec2 uv){
  vec2 s=sc(ia);vec2 u=(uv-.5)*s+.5;
  u.x+=clamp(CX-.5,-(1.-s.x)*.5,(1.-s.x)*.5);   // keep subject in frame on narrow screens
  float d=1.-smoothstep(.0,.62,u.y);           // bottom = near
  u=f+(u-f)/(1.+z*(1.+d*.45));                  // dolly: near layers grow faster
  u+=mouse*(.004+.02*d)+vec2(sin(time*.17),cos(time*.13))*.0025*(.4+d);
  u.y+=sin(u.x*9.+time*.6)*.0007*d;             // heat shimmer on ground
  u+=OFF;
  return texture2D(t,clamp(u,.001,.999)).rgb;
}
vec2 toScr(vec2 f,float ia){vec2 s=sc(ia);f.x-=clamp(CX-.5,-(1.-s.x)*.5,(1.-s.x)*.5);return (f-.5)/s+.5;}
float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
vec3 rays(sampler2D t,float ia,vec2 f,float z,vec2 r,float s){
  if(s<.01)return vec3(0.);
  vec2 rp=toScr(r,ia);vec2 dlt=(vUv-rp)/float(${RS});vec2 uv=vUv;vec3 acc=vec3(0.);float w=1.;
  for(int i=0;i<${RS};i++){uv-=dlt;vec3 c=shot(t,ia,f,z,uv);float l=max(0.,dot(c,vec3(.3,.59,.11))-.62);acc+=c*l*w;w*=.93;}
  return acc/float(${RS})*s*2.6;

void main(){
  float tb=sin(3.14159*p);
  // portal camera: roll + lens bulge while flying through
  vec2 q0=vUv-.5;q0.x*=scr;float an=tb*tb*.22*(p<.5?1.:-1.);
  q0=mat2(cos(an),-sin(an),sin(an),cos(an))*q0;q0*=1.-tb*.22*dot(q0,q0);q0.x/=scr;vec2 uv=q0+.5;
  vec2 oA=distort(pA,uv),oB=distort(pB,uv);
  vec3 a,b;
  if(p<.001){CX=cA;OFF=oA;a=shot(tA,aA,fA,zA,uv);OFF=vec2(0.);a+=rays(tA,aA,fA,zA,rA,rsA);a=fog(a,pA,gA,uv);b=a;}
  else{
    a=vec3(0.);b=vec3(0.);
    for(int i=0;i<10;i++){float k=float(i)/9.;
      CX=cA;OFF=oA;a+=shot(tA,aA,fA,zA+p*2.6+tb*k*.55,uv);
      CX=cB;OFF=oB;b+=shot(tB,aB,fB,zB+(1.-p)*1.6+tb*k*.55,uv);}
    a/=10.;b/=10.;OFF=vec2(0.);
    CX=cA;a+=rays(tA,aA,fA,zA+p*2.6,rA,rsA*(1.-p));CX=cB;b+=rays(tB,aB,fB,zB+(1.-p)*1.6,rB,rsB*p);
    a=fog(a,pA,gA,uv);b=fog(b,pB,gB,uv);
  }
  float m=smoothstep(.36,.66,p);
  vec3 c=mix(a,b,m);
  float ab=tb*.004;                                       // chromatic split during flight
  c.r=mix(c.r,c.r*1.04,tb);c.b*=1.-tb*.06;
  c+=vec3(1.,.82,.55)*pow(tb,7.)*1.1;                       // portal flash
  vec2 q=vUv-.5;c*=1.-.55*pow(length(q*vec2(1.,.85))*1.35,2.2);  // vignette
  c=c*1.04-.015;c=pow(max(c,0.),vec3(.97,1.,1.04));        // grade
  c+=(hash(vUv*res+fract(time)*100.)-.5)*.04;              // film grain
  gl_FragColor=vec4(c,1.);
}`;
  const mat=new THREE.ShaderMaterial({uniforms:U,vertexShader:"varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.);}",fragmentShader:frag,depthTest:false});
  scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat));

  /* particles (2D canvas) */
  const fx=$("#fx"),g=fx.getContext("2d");let W,H;
  function size(){W=fx.width=innerWidth*(mobile?1:1.5);H=fx.height=innerHeight*(mobile?1:1.5);R.setSize(innerWidth,innerHeight);U.scr.value=innerWidth/innerHeight;U.res.value.set(innerWidth,innerHeight)}
  size();addEventListener("resize",size);
  const P=[];const MAX=mobile?90:200;
  function spawn(kind){const s=SCENES.find(x=>x.fx===kind)||SCENES[0];const o={k:kind,life:0};
    if(kind==="beam"){o.x=W*(.45+Math.random()*.45);o.y=H*Math.random();o.vx=(Math.random()-.5)*.15;o.vy=(Math.random()-.5)*.12;o.r=Math.random()*1.8+.4;o.c="255,214,150";o.max=600}
    if(kind==="pollen"){o.x=-10;o.y=H*(.3+Math.random()*.7);o.vx=.4+Math.random()*1.1;o.vy=(Math.random()-.5)*.25;o.r=Math.random()*2+.5;o.c="255,226,160";o.max=900;if(Math.random()<.5)o.x=Math.random()*W}
    if(kind==="sand"){o.x=W+10;o.y=H*(.35+Math.random()*.65);o.vx=-(2+Math.random()*4);o.vy=(Math.random()-.4)*.4;o.r=Math.random()*1.4+.3;o.c="240,190,120";o.max=500;o.streak=1;if(Math.random()<.5)o.x=Math.random()*W}
    if(kind==="embers"){o.x=W*(.47+(Math.random()-.5)*.06);o.y=H*(.72+Math.random()*.04);o.vx=(Math.random()-.5)*.6;o.vy=-(.6+Math.random()*1.6);o.r=Math.random()*2+.6;o.c="255,150,60";o.max=260;o.glow=1}
    if(kind==="lights"){o.x=Math.random()*W;o.y=H*Math.random()*.75;o.vx=0;o.vy=-.05;o.r=Math.random()*1.6+.4;o.c=Math.random()<.7?"255,220,140":"160,210,255";o.max=300;o.tw=1}
    P.push(o)}
  /* mouse */
  const mo={x:0,y:0,tx:0,ty:0};
  addEventListener("pointermove",e=>{mo.tx=(e.clientX/innerWidth-.5);mo.ty=-(e.clientY/innerHeight-.5)});
  const cur={za:0,zb:0,p:0};
  function loop(ms){
    const t=ms*.001,k=still?1:.085;
    mo.x+=(mo.tx-mo.x)*.05;mo.y+=(mo.ty-mo.y)*.05;
    cur.za+=(S.za-cur.za)*k;cur.zb+=(S.zb-cur.zb)*k;
    const jump=Math.abs(S.p-cur.p)>.6;cur.p=jump?S.p:cur.p+(S.p-cur.p)*k;
    const A=SCENES[S.a],B=SCENES[S.b];
    U.tA.value=tex[S.a];U.tB.value=tex[S.b];U.aA.value=A.asp;U.aB.value=B.asp;
    U.fA.value.set(A.f[0],A.f[1]);U.fB.value.set(B.f[0],B.f[1]);U.rA.value.set(A.r[0],A.r[1]);U.rB.value.set(B.r[0],B.r[1]);
    U.rsA.value=A.rs*(.85+.15*Math.sin(t*.8));U.rsB.value=B.rs;U.cA.value=A.cx||.5;U.cB.value=B.cx||.5;U.pA.value.fromArray(A.p);U.pB.value.fromArray(B.p);U.gA.value.fromArray(A.g);U.gB.value.fromArray(B.g);
    U.zA.value=cur.za;U.zB.value=cur.zb;U.p.value=still?(S.p>.5?1:0):cur.p;U.time.value=t;U.mouse.value.set(mo.x,mo.y);
    R.render(scene,cam);
    /* particles */
    const kind=SCENES[cur.p>.5?S.b:S.a].fx;
    g.clearRect(0,0,W,H);
    if(!still){
      const want=kind==="embers"?.9:kind==="sand"?.7:.35;if(P.length<MAX&&Math.random()<want*3)spawn(kind);
      const fl=Math.sin(Math.PI*cur.p);
      for(let i=P.length-1;i>=0;i--){const o=P[i];o.life++;
        if(o.k!==kind){o.life+=6}
        o.x+=o.vx*(1+fl*6)+mo.x*.3;o.y+=o.vy*(1+fl*6);if(o.k==="embers"){o.vx+=(Math.random()-.5)*.08}
        const a=Math.min(1,o.life/40)*Math.max(0,1-o.life/o.max)*(o.tw?(.5+.5*Math.sin(t*4+o.x)):1);
        if(a<=0||o.x<-30||o.x>W+30||o.y<-30||o.y>H+30){P.splice(i,1);continue}
        g.globalAlpha=a;
        if(o.streak||fl>.2){g.strokeStyle=`rgba(${o.c},1)`;g.lineWidth=o.r;g.beginPath();g.moveTo(o.x,o.y);g.lineTo(o.x-o.vx*(4+fl*30),o.y-o.vy*(4+fl*30));g.stroke()}
        else{if(o.glow){const gr=g.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r*5);gr.addColorStop(0,`rgba(${o.c},1)`);gr.addColorStop(1,`rgba(${o.c},0)`);g.fillStyle=gr;g.beginPath();g.arc(o.x,o.y,o.r*5,0,7);g.fill()}
          g.fillStyle=`rgba(${o.c},1)`;g.beginPath();g.arc(o.x,o.y,o.r,0,7);g.fill()}
      }
      g.globalAlpha=1;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
